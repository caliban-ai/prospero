[workspace]
resolver = "3"
members = ["crates/*"]
# The Dioxus dashboard (#97) targets wasm32 only and is deliberately NOT a
# workspace member: `cargo {build,clippy,test} --workspace` and the 85% coverage
# gate (scripts/coverage.sh) all run over members, so a wasm-only UI crate would
# either fail the host-target build or sink measured coverage below the floor.
# It builds via scripts/build-dashboard.sh and has its own CI job (ci.yml).
exclude = ["crates/dashboard"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
prospero-core = { path = "crates/core" }
prospero-api = { path = "crates/api" }
prospero-types = { path = "crates/types" }

# caliban's published contract crate (#239, ADR-0011 §3): the single definition
# of caliband's control-plane wire types. Serde-only — no daemon internals — so
# it is not the wide coupling ADR-0003 rejected. Pinned exactly, as the crate's
# own description asks, because it *is* the wire contract.
caliban-contract = "=0.14.0"

# MCP server surface (#218). Same crate caliban drives its own MCP adapter
# with, so the two speak an identical protocol version to any client.
rmcp = { version = "1.7", features = ["server", "macros", "transport-streamable-http-server"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
kube = { version = "4.0.0", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
schemars = "1.2.1"
serde_yaml = "0.9.34"
